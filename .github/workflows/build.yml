name: Build installers

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The regression tests run the real app with a fake Claude API and a fake account server.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, windows-latest]  # Intel Mac machines: GitHub's Apple-silicon ones are often fully booked. The installer is still universal.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # The account server's tests, against a throwaway PostgreSQL 17.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: semestersync_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test" --health-interval 2s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/semestersync_test
      TOKEN_PEPPER: test-pepper-not-a-secret-0123456789abcdef
      EMAIL_BACKEND: memory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head && alembic check
      - run: pytest -q

  build:
    needs: [test, backend]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [macos-15-intel, windows-latest]  # Intel Mac machines: GitHub's Apple-silicon ones are often fully booked. The installer is still universal.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Signing and notarization switch on by themselves once these repository secrets exist
      # (see "Signing the installers" in the README). Without them the installers are unsigned.
      # An empty CSC_LINK makes electron-builder look for a certificate at the project folder,
      # so the signing variables are only set when the secrets exist.
      - name: Build the installer
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then CERT="$MAC_CERT"; PASS="$MAC_PASS"; TARGET=dist:mac; else CERT="$WIN_CERT"; PASS="$WIN_PASS"; TARGET=dist:win; fi
          if [ -n "$CERT" ]; then export CSC_LINK="$CERT" CSC_KEY_PASSWORD="$PASS"; else export CSC_IDENTITY_AUTO_DISCOVERY=false; echo "No signing certificate set: building unsigned"; fi
          for v in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do [ -z "${!v}" ] && unset $v; done
          npm run $TARGET -- --publish never
        env:
          MAC_CERT: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_PASS: ${{ secrets.MAC_CERT_PASSWORD }}
          WIN_CERT: ${{ secrets.WIN_CERT_P12_BASE64 }}
          WIN_PASS: ${{ secrets.WIN_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Install and start the built app
        shell: bash
        run: scripts/verify-installer.sh
        env:
          REQUIRE_SIGNED: ${{ vars.REQUIRE_SIGNED || '0' }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe

  # On a version tag, put the installers on the repo's Releases page for download.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: |
          (cd installers && sha256sum * > SHA256SUMS.txt)
          cat > notes.md <<'NOTES'
          **Mac:** download `SemesterSync-*-universal.dmg`, open it and drag SemesterSync into Applications. The app isn't signed by Apple yet, so the first time you open it macOS says it "could not verify SemesterSync is free of malware". To open it anyway:
          1. Click **Done** on the warning (not Move to Trash).
          2. Open **System Settings → Privacy & Security**, scroll down to Security and click **Open Anyway** next to *"SemesterSync" was blocked*.
          3. Enter your Mac password and click **Open Anyway** again. You only do this once.

          On macOS 14 or earlier, right-click SemesterSync in Applications, choose **Open**, then **Open** again. If neither works, run `xattr -dr com.apple.quarantine /Applications/SemesterSync.app` in Terminal.

          **Windows:** download `SemesterSync-Setup-*.exe` and run it. If Windows shows "Windows protected your PC", choose **More info → Run anyway**.


          `SHA256SUMS.txt` lists a checksum for each file, so you can check a download wasn't damaged or changed.
          NOTES
          gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --title "SemesterSync $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
