# Local development only: API on http://localhost:8000, Mailpit inbox on http://localhost:8025.
# Nothing here is reachable from other computers: every port is bound to 127.0.0.1.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: semestersync
      POSTGRES_USER: semestersync
      POSTGRES_PASSWORD: dev-only-password
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semestersync"]
      interval: 2s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://semestersync:dev-only-password@db:5432/semestersync
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      mailpit: {condition: service_started}
volumes:
  pgdata:
