# Production: the API, PostgreSQL and Caddy (HTTPS) on one server. NOT DEPLOYED: run only after approval.
#   cp .env.production.example .env.production   # fill in real values; never commit it
#   docker compose --env-file .env.production up -d --build
# Only Caddy is reachable from the internet (ports 80 and 443). The API and the database have no public ports.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: semestersync
      POSTGRES_USER: semestersync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semestersync"]
      interval: 5s
      retries: 20
  api:
    build: ..
    restart: unless-stopped
    env_file: .env.production
    environment:
      APP_ENV: production
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql+psycopg://semestersync:${POSTGRES_PASSWORD}@db:5432/semestersync
      # Only Caddy can reach the API (it has no published port), so its forwarded headers are trusted.
      FORWARDED_ALLOW_IPS: "*"
    networks: [private, web]
    depends_on:
      db: {condition: service_healthy}
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env.production}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    depends_on: [api]
networks:
  private: {internal: true}  # the database never leaves this network
  web: {}
volumes:
  pgdata:
  caddy_data:
  caddy_config:
